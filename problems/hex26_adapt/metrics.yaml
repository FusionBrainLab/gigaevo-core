# Copied verbatim from problems/hex23_improve/metrics.yaml for the expert-hint
# adaptation study: all four conditions (hint x lineage) measure and score
# identically; they differ only in the memory bank content and archive policy.
specs:
  fitness:
    description: Main objective, higher is better
    decimals: 5
    is_primary: true
    higher_is_better: true
    # fitness = -L, the outer hexagon's side length for n=26. The bounds are the
    # MAP-Elites binning range, so they have to bracket what a run actually produces
    # without wasting the 150 bins. Upper: the best known packing is L=5.70972
    # (Kravatsky et al., the paper's own standing record), and no optimum is proven,
    # so -5.5 leaves headroom for a real record while staying far tighter than the
    # loose area bound L >= sqrt(26) = 5.10.
    # Lower: a valid-but-lazy packing (hexagons spread on a coarse grid) lands well
    # above L=10 at n=23 and scales ~sqrt(n); -15.0 keeps those binnable instead of
    # clipping them all together.
    lower_bound: -15.0
    upper_bound: -5.5
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -1000
  is_valid:
    description: Whether the program is valid (1 valid, 0 invalid)
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
    sentinel_value: 0
  # Diagnostics. include_in_prompts is false on all three: telling one arm how many
  # calls it got, or how often it was feasible, is coaching that the other arms do
  # not receive. They exist to answer the reviewer's objection that the DirectEvolve
  # baseline is one-shot -- a basic-arm run reporting proposals=1 is a crippled
  # baseline, and the number has to be recorded to show it is not.
  #
  # Stage B is bounded by the wall clock, not a round count, so proposals is now
  # unbounded in principle: the published improver made 1376 calls at n=23 and 4193
  # at n=11 in its 600s. A cheap program can make many more, so the ceiling is set
  # where a metric that overflowed its range would stop being readable, not where we
  # expect the arms to land.
  proposals:
    description: Calls the program was given within its wall-clock budget
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 20000.0
    include_in_prompts: false
    significant_change: 1.0
    sentinel_value: 0
  accepted:
    description: Calls that improved the incumbent
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1000.0
    include_in_prompts: false
    significant_change: 1.0
    sentinel_value: 0
  valid_rate:
    description: Fraction of calls the independent verifier accepted as feasible
    decimals: 3
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: false
    significant_change: 0.05
    sentinel_value: 0
