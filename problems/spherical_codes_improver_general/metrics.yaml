specs:
  fitness:
    description: Mean relative improvement over the Cohn warm-start across the catalogue, in percent (higher is better)
    decimals: 4
    is_primary: true
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -1.0
  is_valid:
    description: Whether the program produced any valid (n, d) unit-norm configuration (1 valid, 0 invalid)
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
    sentinel_value: 0
