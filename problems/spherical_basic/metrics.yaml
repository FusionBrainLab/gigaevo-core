# Identical in all three arms. The arms differ in the interface the LLM implements,
# never in what is measured or how it is scored.
specs:
  fitness:
    description: Mean signed relative improvement over the Cohn warm-start across the development configurations, in percent (higher is better; negative means the program never reached the baseline)
    decimals: 4
    is_primary: true
    higher_is_better: true
    # SIGNED, and scored on the best mu a proposal was VALIDATED at — not on the
    # incumbent. Both halves of that matter. The shipped grader floors the score at zero,
    # and on a warm-started arm the incumbent can never be worse than Cohn anyway, so
    # between them every arm that has not yet won reads exactly 0.0 and evolution climbs
    # a flat surface. Beating Cohn is the hard part of this benchmark, so that is most of
    # a run. Signed and read off the proposal, the score keeps resolving below the
    # baseline and the search has a gradient the whole way up.
    #
    # The bounds are the attainable range, not a guess. mu is at most 1 (two coincident
    # points: the worst code that is still valid) and mu_cohn is at least 0.306 on this
    # panel, so the worst a program can score is -118.1 — that is what a run that
    # validates nothing on any configuration gets. The sentinel must equal
    # problems._harness.benchmarks.spherical_grading.INVALID_FITNESS or the engine and the grader
    # disagree about what "invalid" means, and it must sit BELOW that worst attainable
    # score: a sentinel above it would rank a program that produces nothing over one that
    # produces something bad, and the search would learn to produce nothing.
    lower_bound: -120.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -200.0
  is_valid:
    description: Whether the program produced any valid (n, d) unit-norm configuration (1 valid, 0 invalid)
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
    sentinel_value: 0
  # The published score: floored at zero and read off the incumbent, exactly as
  # problems/spherical_codes_improver_general/validate.py computes it. Kept ONLY so the
  # campaign's figures stay comparable to this experiment's. Nothing selects on it.
  gain_floored:
    description: Mean relative improvement over Cohn, floored at zero — the published metric (higher is better)
    decimals: 4
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: false
    significant_change: 0.01
    sentinel_value: 0
  # The mu that was ACCEPTED. Every arm's incumbent is seeded with the Cohn config and
  # promotion is strictly-better, so this can never exceed the baseline: an arm that
  # fails to improve reports mean_mu exactly equal to the baseline, whether it missed by
  # 1e-9 or was never close. It is here because it is the physical quantity the paper
  # reports — the coherence actually reached — not because it resolves anything fitness
  # does not. Diagnostic only: the search optimizes `fitness`, identically for all three.
  mean_mu:
    description: Mean mu of the accepted configurations (lower is better)
    decimals: 6
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: false
    significant_change: 0.0001
    sentinel_value: 1.0
  # What `fitness` is scored on: the best mu any proposal was VALIDATED at, promoted or
  # not. Unlike the incumbent it is free to be worse than Cohn, which is the whole reason
  # the score can now be negative. Averaged over the configurations where the arm was
  # feasible at all — a configuration it validated nothing on is graded by `fitness` (at
  # mu = 1) but contributes no coherence here, because none was ever reached.
  mean_mu_proposed:
    description: Mean best validated mu across the development configurations, accepted or not (lower is better)
    decimals: 6
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: false
    significant_change: 0.0001
    sentinel_value: 1.0
  configs_improved:
    description: Configurations where the program beat the Cohn baseline
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 14.0
    include_in_prompts: false
    significant_change: 1.0
    sentinel_value: 0
  # Configurations the program validated NOTHING on. Each one costs `fitness` that
  # configuration's full mu = 1 penalty — up to 227 points on (16, 296) — so a score deep
  # in the negatives is read here first: it separates "tried everywhere and was bad" from
  # "never produced a code at all on three of the fourteen".
  configs_dead:
    description: Configurations where no proposal was ever valid (lower is better)
    decimals: 0
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 14.0
    include_in_prompts: false
    significant_change: 1.0
    sentinel_value: 14
  # Diagnostics. include_in_prompts is false on all of these: telling one arm how many
  # calls it got, or how often it was feasible, is coaching the other arms do not
  # receive. They exist to answer the reviewer's objection that the DirectEvolve
  # baseline is one-shot -- a basic-arm run reporting proposals=1 is a crippled
  # baseline, and the number has to be recorded to show it is not. Summed across the 14
  # configurations, so the ceiling is 14x a single config's.
  proposals:
    description: Calls the program was given within its wall-clock budget, summed over configurations
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 200000.0
    include_in_prompts: false
    significant_change: 1.0
    sentinel_value: 0
  accepted:
    description: Calls that improved the incumbent, summed over configurations
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 10000.0
    include_in_prompts: false
    significant_change: 1.0
    sentinel_value: 0
  valid_rate:
    description: Fraction of calls the independent verifier accepted as feasible, averaged over configurations
    decimals: 3
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: false
    significant_change: 0.05
    sentinel_value: 0
