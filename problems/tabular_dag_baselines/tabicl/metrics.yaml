specs:
  fitness:
    description: Existing tabular protocol score after applying the evolved FeatureGraph and fitting fixed TabICLv2; R2 for regression and accuracy for classification.
    decimals: 5
    is_primary: true
    higher_is_better: true
    lower_bound: -1.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
  is_valid:
    description: Whether graph parsing, feature execution, and TabICLv2 evaluation succeeded.
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
  cv_score_std:
    description: Standard deviation of the existing tabular protocol's fold scores.
    decimals: 5
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 2.0
    include_in_prompts: true
    significant_change: 0.01
  graph_node_count:
    description: Diagnostic count of pandas transformation nodes; not an optimization objective.
    decimals: 0
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 16.0
    include_in_prompts: false
    significant_change: 1.0
  graph_max_depth:
    description: Diagnostic longest dependency path; depth is neutral and useful when composition adds signal.
    decimals: 0
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 16.0
    include_in_prompts: false
    significant_change: 1.0
  generated_feature_count:
    description: Diagnostic count of generated columns exported to the fixed estimator; not an optimization objective.
    decimals: 0
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 64.0
    include_in_prompts: false
    significant_change: 1.0
  local_lipschitz_p95:
    description: Existing tabular behavior descriptor for local prediction sensitivity.
    decimals: 4
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 4.0
    include_in_prompts: false
    significant_change: 0.01
  ood_delta_slope:
    description: Existing tabular behavior descriptor for response to covariate shift.
    decimals: 4
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 2.0
    include_in_prompts: false
    significant_change: 0.01
