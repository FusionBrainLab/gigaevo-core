specs:
  fitness:
    description: Mean per-fold accuracy over cross-validation (higher is better, 1.0 = perfect). MAP-Elites selection signal.
    decimals: 5
    is_primary: true
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
  is_valid:
    description: Whether the program is valid (1 valid, 0 invalid)
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
  macro_f1:
    description: Mean per-fold macro-averaged F1 across all classes.
    decimals: 5
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
  balanced_accuracy:
    description: Mean per-fold balanced accuracy (robust to class imbalance).
    decimals: 5
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.01
  log_loss:
    description: Mean per-fold log loss on predicted probabilities (capped at 100).
    decimals: 5
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 100.0
    include_in_prompts: true
    significant_change: 0.01
  cv_score_std:
    description: Std of per-fold accuracy (fold-to-fold stability; small = consistent).
    decimals: 5
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 2.0
    include_in_prompts: true
    significant_change: 0.01
  local_lipschitz_p95:
    description: log1p of the 95th-percentile normalised local Lipschitz slope (BD axis; archive coordinate, not optimisation target).
    decimals: 4
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 4.0
    include_in_prompts: false
    significant_change: 0.01
  ood_delta_slope:
    description: log1p of normalised output change under a 1.5 sigma covariate shift (BD axis; archive coordinate, not optimisation target).
    decimals: 4
    is_primary: false
    higher_is_better: false
    lower_bound: 0.0
    upper_bound: 2.0
    include_in_prompts: false
    significant_change: 0.01
