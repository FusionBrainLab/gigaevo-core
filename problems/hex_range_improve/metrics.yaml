# Identical in both arms. The arms differ in the interface the LLM implements,
# never in what is measured or how it is scored.
specs:
  fitness:
    description: Main objective, higher is better
    decimals: 5
    is_primary: true
    higher_is_better: true
    # fitness = -(mean over valid n of L_n/sqrt(n) + 1 per invalid n) over the
    # train sizes {11, 12, 15, 17, 23}. The area bound L >= sqrt(n) puts each
    # ratio above 1, and the best published packings sit near 1.12-1.19, so
    # -1.10 is unreachable headroom. Lower: a program whose valid sizes only
    # reach lazy row/grid packings (ratio ~5) with a few invalid sizes lands
    # near -9; -10.0 keeps those binnable instead of clipping them together.
    lower_bound: -10.0
    upper_bound: -1.10
    include_in_prompts: true
    significant_change: 0.002
    sentinel_value: -1000
  is_valid:
    description: Whether the program is valid (1 valid, 0 invalid). Valid means
      at least one train size produced an accepted configuration.
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
    sentinel_value: 0
  n_valid:
    description: Number of train sizes (of 5) with a valid configuration
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 5.0
    include_in_prompts: true
    significant_change: 1.0
    sentinel_value: 0
  # Per-size objectives, prompt-visible in BOTH arms identically: they are the
  # components of the aggregate the program is asked to optimize, not coaching.
  # Upper bounds are the geometric area bound -sqrt(n), never a record value.
  fitness_11:
    description: -L at N=11 (side length of the enclosing hexagon; sentinel when invalid)
    decimals: 5
    is_primary: false
    higher_is_better: true
    lower_bound: -40.0
    upper_bound: -3.31
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -1000
  fitness_12:
    description: -L at N=12 (sentinel when invalid)
    decimals: 5
    is_primary: false
    higher_is_better: true
    lower_bound: -40.0
    upper_bound: -3.46
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -1000
  fitness_15:
    description: -L at N=15 (sentinel when invalid)
    decimals: 5
    is_primary: false
    higher_is_better: true
    lower_bound: -40.0
    upper_bound: -3.87
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -1000
  fitness_17:
    description: -L at N=17 (sentinel when invalid)
    decimals: 5
    is_primary: false
    higher_is_better: true
    lower_bound: -40.0
    upper_bound: -4.12
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -1000
  fitness_23:
    description: -L at N=23 (sentinel when invalid)
    decimals: 5
    is_primary: false
    higher_is_better: true
    lower_bound: -40.0
    upper_bound: -4.79
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: -1000
  # Diagnostics, summed over the five sizes. include_in_prompts false for the
  # Exp A reason: call counts and feasibility rates are budget accounting the
  # arms must not be coached on; they exist to show the direct baseline is not
  # one-shot crippled.
  proposals:
    description: Calls the program was given within its wall-clock slices, all sizes
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 100000.0
    include_in_prompts: false
    significant_change: 1.0
    sentinel_value: 0
  accepted:
    description: Calls that improved a size's incumbent, all sizes
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 5000.0
    include_in_prompts: false
    significant_change: 1.0
    sentinel_value: 0
  valid_rate:
    description: Fraction of calls the independent verifier accepted as feasible
    decimals: 3
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: false
    significant_change: 0.05
    sentinel_value: 0
