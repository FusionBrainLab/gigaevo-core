[pytest]
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
testpaths = tests
addopts = --tb=short -q --timeout=30 -n auto --dist=loadgroup
timeout_method = thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: throughput benchmarks (run with 'pytest tests/benchmarks/')
    xdist_group: group tests that must run on the same worker (loadgroup dist)
