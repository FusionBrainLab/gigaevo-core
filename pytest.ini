[pytest]
pythonpath = .
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
testpaths = tests
addopts = --tb=short -q --timeout=30 --import-mode=importlib
# signal: a hung test fails alone instead of killing the process (and coverage.xml)
timeout_method = signal
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    benchmark: throughput benchmarks (run with 'pytest tests/benchmarks/')
