defaults:
  - program_format: python_source  # Candidate representation: python_source | json_document
  - experiment: base       # Base experiment setup (override with experiment=full_featured)
  - storage: disk          # Program/archive storage backend (override with storage=redis)
  - /migration_bus: disabled
  - aggregator: none       # NullAggregator sentinel (override with aggregator=<name>)
  - archive_selector: point  # Archive replacement rule (override with archive_selector=paired_bootstrap)
  - stopper: max_mutants  # Pluggable stopper (override with stopper=wall_clock, stopper=fitness_plateau, ...)
  - chains/runner: none    # Chain runner preset for chain-task problems (override with chains/runner=simple|dataset|metrics|self_critic*)
  - override hydra/job_logging: disabled   # Suppress Hydra's auto-created {job.name}.log; gigaevo uses loguru → evolution_*.log
  - _self_

# Problem metadata (set via command line or problem-specific config)
problem:
  name: ???  # Required
  dir: ${hydra:runtime.cwd}/problems/${problem.name}

# Stable statistical task identity for memory. Parameterized problems can
# override this without renaming their problem directory, for example
# memory_task_key=dag_tab/adult.
memory_task_key: ${problem.name}

# Memory run-state directory. Per-run by default — lands under the Hydra run
# directory for isolation across concurrent runs. Use memory_bank_dir below to
# share cards between runs without sharing their detailed causal ledgers.
checkpoint_dir: ${hydra:runtime.output_dir}/memory

# Card-bank location. It follows checkpoint_dir by default; override just this
# path to let multiple task runs read and populate one shared memory bank while
# their detailed causal ledgers remain run-local. Shared-bank authoring is
# serialized across processes so semantic deduplication cannot race admission.
memory_bank_dir: ${checkpoint_dir}

# One durable registry is shared by the memory reader, writer, and engine.
selection_leases:
  _target_: gigaevo.memory.selection_leases.SharedSelectionRegistry
  path: ${memory_bank_dir}/selection_leases.json

# LLM I/O audit trail. When true (default), every router call (plain +
# structured) is dumped as a complete JSON record (prompt, response, token
# usage) into <run_dir>/llm_io/<router>.jsonl. Set false to disable.
llm_io_dump: true

# Optional chain topology metric stage. Enable when an archive behavior space
# requires chain structural keys, for example algorithm=topology_3d_ret.
enable_chain_structural_metrics: false
