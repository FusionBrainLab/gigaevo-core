# @package _global_

# Redis connection parameters
redis:
  host: localhost
  port: 6379
  db: 0
  resume: false
  # Namespace for this run's Redis keys. Defaults to ${problem.name} so that
  # pipelines can write `${redis.prefix}` and get the same key-prefix used by
  # program_storage.config.key_prefix (see config/storage/redis.yaml, I-12).
  # Override per-run if a run needs a namespace that differs from its problem name.
  prefix: ${problem.name}
