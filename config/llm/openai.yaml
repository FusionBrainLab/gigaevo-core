# @package _global_

# Single mutation LLM: openai/gpt-5.5 via OpenRouter.
#
# Per https://developers.openai.com/api/docs/guides/latest-model and the
# GPT-5 reasoning-model API:
#   - GPT-5 reasoning models do NOT support temperature / top_p sampling
#     params (silently ignored). They are omitted here on purpose.
#   - `reasoning.effort` (minimal/low/medium/high) and `text.verbosity`
#     (low/medium/high) are the GPT-5 tuning knobs. OpenRouter forwards
#     them via `extra_body`. Default effort is "medium" — for high-stakes
#     evolutionary mutation we pin "high".
#   - `verbosity: medium` is the OpenAI default; left unset.
#   - `max_completion_tokens` is the GPT-5 token budget knob; the OpenAI
#     SDK alias `max_tokens` is still accepted by OpenRouter.
#
# Requires env var: OPENAI_API_KEY=<openrouter-api-key>
#
# Usage:
#   python run.py ... llm=openai

llm:
  _target_: gigaevo.llm.models.MultiModelRouter
  _convert_: all
  models:
    - _target_: langchain_openai.ChatOpenAI
      model: openai/gpt-5.5
      api_key: ${oc.env:OPENAI_API_KEY}
      max_tokens: ${max_tokens}
      base_url: https://openrouter.ai/api/v1
      request_timeout: ${request_timeout}
      extra_body:
        reasoning:
          effort: high
  probabilities: [1.0]
  writer: ${ref:writer}
