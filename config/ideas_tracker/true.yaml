# Backward compatibility alias: ideas_tracker=true → same as ideas_tracker=default
defaults:
  - _self_
  - override /memory/backend@_global_.memory.backend: local
  - override /llms@_global_.memory_llm: gemini_flash_openrouter

_target_: gigaevo.memory.ideas_tracker.ideas_tracker.IdeaTracker
llm: ${ref:memory_llm}
backend: ${ref:memory.backend}
analyzer_type: default
analyzer_max_concurrent_classifications: 8
description_rewriting: true
memory_write_enabled: true
memory_write_best_programs_percent: 5.0
fitness_higher_is_better: ${higher_is_better}
metrics_context: ${metrics_context}
checkpoint_dir: ${checkpoint_dir}
# Session logs (sweep windows, classify transcripts) belong in the run's
# output dir, not the installed package tree.
logs_dir: ${hydra:runtime.output_dir}/tracker
redis_prefix: ${problem.name}
# Rides the read-side memory= group: memory=local injects its admitter
# (sign_based by default), memory=none leaves it null (SignBasedAdmitter
# fallback) — so best_ideas.json contents depend on the chosen read backend.
admitter: ${ref:memory.admitter}
# Same riding for the write-side dedup/evictor singletons (memory=none → null,
# backend defaults apply).
evictor: ${ref:memory.evictor}
deduplicator: ${ref:memory.dedup}
# Injection posteriors use the SAME reputation singleton as the read-side
# admitter/auction, so `memory/reputation` knob overrides reach the tracker
# (memory=none → null, module defaults apply).
reputation: ${ref:memory.reputation}
