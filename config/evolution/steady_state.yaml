# @package _global_
#
# Steady-state evolution engine: continuous mutation/evaluation interleaving.
# Opt-in via:  python run.py evolution=steady_state ...

defaults:
  - default

# Override engine config with steady-state tunables
engine_config:
  _target_: gigaevo.evolution.engine.SteadyStateEngineConfig
  loop_interval: ${loop_interval}
  program_acceptor: ${program_acceptor}
  parent_selector: ${parent_selector}
  stopper: ${stopper}
  max_in_flight: 8

# Override engine target
evolution_engine:
  _target_: gigaevo.evolution.engine.SteadyStateEvolutionEngine
  storage: ${ref:program_storage}
  strategy: ${evolution_strategy}
  mutation_operator: ${mutation_operator}
  config: ${engine_config}
  writer: ${ref:writer}
  metrics_tracker: ${metrics_tracker}
  pre_step_hook: ${pre_step_hook}
  post_run_hook: ${ref:memory.write.post_run_hook}
  post_step_hook: ${post_step_hook}
