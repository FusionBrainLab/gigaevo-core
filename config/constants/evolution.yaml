# @package _global_
# Evolution engine constants

loop_interval: 1.0
sync_min_delta: 8
num_parents: 2
mutation_mode: rewrite
max_mutants: 250
strip_comments_and_docstrings: false
pre_step_hook: null
post_step_hook: null
# Wall-clock bound (seconds) on a single post_step_hook invocation. 300s suits
# the CPU-bound production CompositionInjectionHook; the network-bound
# LiveMemoryRefreshHook (LLM enrichment) raises it via the memory recipe.
# Override per run: post_step_hook_timeout_s=<seconds>.
post_step_hook_timeout_s: 300.0
# Shutdown budget for ingesting already-persisted mutants. Cheap problems keep the
# historical 5s default; expensive validators can override it from the CLI.
final_ingestion_timeout_s: 5.0
max_in_flight: 8
# Guard against structured-output/schema failures that do not increment max_mutants.
# Zero preserves legacy behavior; set per run for bounded LLM experiments.
max_consecutive_mutation_failures: 0
