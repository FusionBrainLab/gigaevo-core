# @package memory.probe_policy
# Explicit cold-card exploration lane. It probes only cards whose effective
# support sits below the eviction evidence floor, so the probe and eviction
# lanes partition card-space; warm exploitation flows through auction/budget.
_target_: gigaevo.memory.read.probe.ColdProbePolicy
enabled: true
probe_until_effective_events: ${memory.evidence.min_effective_events}
max_probe_cards_per_decision: 1
empty_selection_probe_rate: 0.50
warm_override_probe_rate: 0.03
