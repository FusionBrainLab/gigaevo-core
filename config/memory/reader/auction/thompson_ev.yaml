# @package memory.auction
# EV-bid Thompson auction (the `thompson_ev` arm). Same no-card abstain gate as
# `auction=thompson`, but bids theta x magnitude so `budget=top_bid` ranks
# winners by expected gain. `ev_floor` abstains on non-positive expected gain
# (never inject a card you expect to hurt); cold cards bid `prior_magnitude`, so
# the floor never strands a fresh card. `prior_magnitude` is the optimistic
# cold-gain prior — tune per substrate fitness scale (e.g. memory.auction.prior_magnitude=0.05).
_target_: gigaevo.memory.core.auctioneer.EVThompsonAuctioneer
baseline_prior: [3.0, 3.0]
prior_magnitude: 0.1
ev_floor: 0.0
