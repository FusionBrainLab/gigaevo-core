# memory=full — read + write both on (the old `memory=local ideas_tracker=default`).
# ONE assembled MemorySystem node: Hydra builds the component leaves below and
# passes them to MemorySystem, which threads the shared reputation/backend/llm
# in Python (no ${ref:memory.*} sibling web). Component leaves are grouped by
# role: `common/` (shared by reader + writer), `reader/` (the read provider),
# and `writer/` (the librarian write path). Swap a component with e.g.
# `memory/common/llm=qwen_instruct` or `memory/reader/auction=thompson`; tune a
# leaf field with `memory.auction.baseline_prior=[5,2]` (the leaf still lands at
# `memory.<kwarg>`, so dotted overrides are unchanged). Default stack = the EV
# contextual-bandit treatment: absolute-progress value channel + EV-bid auction +
# bid-ranked budgeter (works on every algorithm). Single-island runs can upgrade
# to `memory/common/reputation=bd_proximity` for cell-local credit; revert to the
# legacy probability-only stack with `memory/common/reputation=beta_binomial
# memory/reader/auction=thompson memory/reader/budget=top_theta`.
defaults:
  - common/llm: gemini
  - common/reputation: absolute_progress
  - common/backend: local
  - reader/retriever: gam
  - reader/selector: llm
  - reader/auction: thompson_ev
  - reader/budget: top_bid
  - reader/excluder: none
  - reader/provider: selector
  - writer/tracker: librarian
  - writer/evictor: harm
  - _self_

_target_: gigaevo.memory.system.MemorySystem
reader_enabled: true
writer_enabled: true
