# memory=full — read + write both on.
#
# A flat ${ref:} graph: every component is declared once and shared by
# reference (instantiate-once with write-back, exactly how algorithm configs
# share behavior_space/program_storage). No assembler, no partials — Hydra
# builds exactly what this file declares. Consumers read two nodes: pipelines
# take ${ref:memory.provider}, engines take ${ref:memory.writer}.
#
# Public read-stack choices live in `memory/read_policy`: `adaptive`
# (default contextual bootstrap with EB cold priors, no-card evidence, and cold
# probes), `portable` (global context), and explicit legacy/decay ablations.
# Override with `memory/read_policy=portable`; tune leaf fields with
# `memory.reader.max_cards=2`.
defaults:
  - llm: gemini
  - read_policy: adaptive
  - crediting: point
  - evictor: recommended
  # Live is the default: memory=full reads and writes one bank, so cards must be
  # authored mid-run or the reader sees an empty bank (the compose guard rejects
  # end_of_run + default checkpoint_dir). Override to end_of_run only to seed a
  # bank for a later memory=reader run against an explicit checkpoint_dir.
  - write: live
  - _self_

capabilities:
  read: true
  write: true

# Neutral point for baseline-adjusted card gain. Use-attributed gains are
# child-parent deltas after subtracting the no-card baseline, so this value is
# the no-card counterfactual origin, not a task-specific metric threshold.
neutral_gain: 0.0

# Shared fallback no-card arm prior. Dynamic no-card evidence can override this
# per read, but static/legacy paths and cold fallback priors stay aligned here.
baseline_prior: [3.0, 3.0]

context_model:
  task_key: ${problem.name}

# Shared evidence defaults for confidence, harm, and eviction gates.
evidence:
  # Minimum effective non-founding card-use evidence before the system can make
  # a strong keep/delete decision. This is one knob so reputation confidence,
  # harm eviction, and policy-nonviable cleanup do not drift apart.
  min_effective_events: 3

eviction_safety:
  min_effective_events: ${memory.evidence.min_effective_events}
  skip_contextual_without_context: true

evicted_evidence:
  _target_: gigaevo.memory.prior_evidence.JsonlEvictedEvidence
  path: ${checkpoint_dir}/evicted_evidence.jsonl
  max_cards: 10000

# Off-policy evaluation of the card policy. The writer refreshes this after each
# increment (live sweeps + final), so the DR-AIPW probe-ITT effect (tau) lands in
# ${checkpoint_dir}/ope_summary.json in-progress, not only at completion. It reads
# the run's own memory_events.jsonl and never affects evolution (read-only, all
# errors swallowed). eps/alpha/propensity_tolerance are OPE-computation defaults
# (estimator hygiene, not memory-policy magnitudes) and default in the estimator.
ope_reporter:
  _target_: gigaevo.memory.ope.reporter.MemoryOpeReporter
  checkpoint_dir: ${checkpoint_dir}

# One store per run, owning bank + vector index + research agent under the
# run's checkpoint dir. The reader and the writer share this single instance by
# reference (below) — a write is visible to the next read with no cross-view
# sync.
store:
  _target_: gigaevo.memory.storage.local.LocalMemoryStore
  config:
    _target_: gigaevo.memory.storage.config.StoreConfig
    path: ${checkpoint_dir}
    # Recall width: the research agent pulls default_top_k nearest cards per
    # scoped query, aggregates them into a candidate pool across iterations,
    # and the reflector shortlists up to max_cards of them. That shortlist is
    # the auction's input population — keep it wider than the injection budget
    # so the auction actually has candidates to rank.
    research:
      _target_: gigaevo.memory.storage.config.ResearchConfig
      default_top_k: 10
      max_cards: 10
  llm: ${ref:memory.llm}
  prompts_dir: ${prompts.dir}

reader:
  _target_: gigaevo.memory.read.reader.MemoryReader
  # `memory/read_policy` owns shortlister/reputation/auction/budget/excluder as
  # one coherent bandit stack. The reader consumes those shared component refs.
  reputation: ${ref:memory.reputation}
  auctioneer: ${ref:memory.auction}
  budgeter: ${ref:memory.budget}
  context_model: ${ref:memory.context_model}
  candidate_projector:
    _target_: gigaevo.memory.read.projection.AuctionCandidateProjector
    prior: ${ref:memory.prior}
    context_model: ${ref:memory.context_model}
    no_card_evidence: ${ref:memory.no_card_evidence}
  probe_policy: ${ref:memory.probe_policy}
  renderer:
    _target_: gigaevo.memory.read.render.EfficacyCardRenderer
    task_key: ${problem.name}
  # Injection budget: cards the mutator sees per child, after the auction ranks
  # the recall shortlist above. Recall width lives in
  # memory.store.config.research.max_cards.
  max_cards: 1

provider:
  _target_: gigaevo.memory.provider.LeasedMemoryProvider
  provider:
    _target_: gigaevo.memory.provider.ReaderMemoryProvider
    reader: ${ref:memory.reader}
    excluder: ${ref:memory.excluder}
  store: ${ref:memory.store}
  registry: ${ref:selection_leases}

writer:
  _target_: gigaevo.memory.write.writer.MemoryWriter
  llm: ${ref:memory.llm}
  evictor: ${ref:memory.evictor}
  store: ${ref:memory.store}
  checkpoint_dir: ${checkpoint_dir}
  task_key: ${problem.name}
  metrics_context: ${ref:problem_context::metrics_context}
  baseline_estimator: ${ref:memory.context_model}
  effect_estimator: ${ref:memory.crediting}
  no_card_recorder: ${ref:memory.no_card_evidence}
  task_description: ${ref:problem_context::task_description}
  best_programs_percent: 5.0
  # Per-call wall-clock bound on each librarian LLM call (reconcile/author). A
  # stalled call past this is skipped (record retried next sweep) so one hung
  # memory-LLM request cannot freeze the whole write increment.
  ingest_call_timeout_s: 300.0
  # After this many cards are written across sweeps, schedule one background
  # near-duplicate consolidation pass over the whole bank (folds drifted
  # same-lever cards the greedy online path let in separately). Declined pair
  # rulings are remembered across passes, so a pass only pays the consolidate
  # LLM for pairs it has not already ruled on. 0 disables.
  consolidation_every_n: 32
  # Dedup knobs of the librarian write path: neighbor-context widths for the
  # reconcile agent and the consolidation arbiter (pure top-k, no distance cut).
  # Program exemplars dedup by exact code identity in the librarian, so there is
  # no exemplar distance threshold.
  dedup_policy:
    _target_: gigaevo.memory.write.merge.DedupPolicy
    online_top_k: 5
    max_cards_per_diff: 3
    consolidation_k: 5
  # Program exemplar controls: exact normalized-source identity via code hash,
  # bounded authoring per refresh, and a hard total archive cap. No prose/word
  # similarity is used for exemplar dedup.
  program_exemplars:
    _target_: gigaevo.memory.write.merge.ProgramExemplarPolicy
    enabled: true
    top_k_per_refresh: 4
    max_cards: 12
    min_fitness_gap: 0.0
    store_code: false
  # Novelty-admission gate: an LLM judge rejects freshly-authored idea cards that
  # a strong model would already reach for unprompted. One extra memory-LLM hop
  # per authored insight card; fails open on judge error. Insight cards only —
  # program exemplars carry concrete code+fitness and dedup by exact code
  # identity, so prose-novelty is the wrong axis for them. OFF by default: in a
  # 2026-07 heilbron comparison the gated arm climbed markedly slower, but that
  # comparison also changed the embedder and store architecture — the A/B
  # isolating the gate's own effect is still running.
  novelty_admission_gate: false
  prompts_dir: ${prompts.dir}
  selection_leases: ${ref:selection_leases}
  min_effective_events: ${memory.evidence.min_effective_events}
  evicted_evidence: ${ref:memory.evicted_evidence}
  ope_reporter: ${ref:memory.ope_reporter}
