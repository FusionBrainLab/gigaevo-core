# memory=full — read + write both on.
#
# A flat ${ref:} graph: every component is declared once and shared by
# reference (instantiate-once with write-back, exactly how algorithm configs
# share behavior_space/program_storage). No assembler, no partials — Hydra
# builds exactly what this file declares. Consumers read two nodes: pipelines
# take ${ref:memory.provider}, engines take ${ref:memory.writer}.
#
# Swap a component group with e.g. `memory/llm=qwen_instruct` or
# `memory/auction=thompson`; tune a leaf field with
# `memory.reader.max_cards=2`. Default stack = the EV contextual-bandit
# treatment: EV-bid auction + bid-ranked budgeter over the cell-local
# BD-proximity injection posterior (per-cell credit, global Beta-Binomial
# fallback for cold cells), with lineage exclusion so a child never re-sees a
# card already applied up its own ancestry. BD-proximity requires a
# single-island algorithm exposing a top-level `behavior_space` (the framework
# default); multi-island runs must fall back to
# `memory/reputation=beta_binomial memory/excluder=none`. The legacy
# probability-only stack is `memory/auction=thompson memory/budget=top_theta`.
defaults:
  - llm: gemini
  - reputation: bd_proximity
  - auction: thompson_ev
  - budget: top_bid
  - excluder: lineage
  - evictor: harm
  - _self_

# One store per run, owning bank + vector index + research agent under the
# run's checkpoint dir. The reader and the writer share this single instance by
# reference (below) — a write is visible to the next read with no cross-view
# sync.
store:
  _target_: gigaevo.memory.storage.local.LocalMemoryStore
  config:
    _target_: gigaevo.memory.storage.config.StoreConfig
    path: ${checkpoint_dir}
    # Recall width: the research agent pulls default_top_k nearest cards per
    # scoped query, aggregates them into a candidate pool across iterations,
    # and the reflector shortlists up to max_cards of them. That shortlist is
    # the auction's input population — keep it wider than the injection budget
    # so the auction actually has candidates to rank.
    research:
      _target_: gigaevo.memory.storage.config.ResearchConfig
      default_top_k: 10
      max_cards: 10
  llm: ${ref:memory.llm}
  prompts_dir: ${prompts.dir}

reader:
  _target_: gigaevo.memory.read.reader.MemoryReader
  shortlister:
    _target_: gigaevo.memory.read.shortlist.ResearchShortlister
    store: ${ref:memory.store}
  reputation: ${ref:memory.reputation}
  auctioneer: ${ref:memory.auction}
  budgeter: ${ref:memory.budget}
  renderer:
    _target_: gigaevo.memory.read.render.EfficacyCardRenderer
  # Injection budget: cards the mutator sees per child, after the auction ranks
  # the recall shortlist above. Recall width lives in
  # memory.store.config.research.max_cards.
  max_cards: 1

provider:
  _target_: gigaevo.memory.provider.ReaderMemoryProvider
  reader: ${ref:memory.reader}
  excluder: ${ref:memory.excluder}

writer:
  _target_: gigaevo.memory.write.writer.MemoryWriter
  llm: ${ref:memory.llm}
  evictor: ${ref:memory.evictor}
  store: ${ref:memory.store}
  checkpoint_dir: ${checkpoint_dir}
  metrics_context: ${ref:problem_context::metrics_context}
  task_description: ${ref:problem_context::task_description}
  best_programs_percent: 5.0
  # Per-call wall-clock bound on each librarian LLM call (reconcile/author). A
  # stalled call past this is skipped (record retried next sweep) so one hung
  # memory-LLM request cannot freeze the whole write increment.
  ingest_call_timeout_s: 300.0
  # After this many cards are written across sweeps, schedule one background
  # near-duplicate consolidation pass over the whole bank (folds drifted
  # same-lever cards the greedy online path let in separately). Declined pair
  # rulings are remembered across passes, so a pass only pays the consolidate
  # LLM for pairs it has not already ruled on. 0 disables.
  consolidation_every_n: 32
  # Dedup knobs of the librarian write path: neighbor-context widths for the
  # reconcile agent and the consolidation arbiter (pure top-k, no distance cut).
  # Program exemplars dedup by exact code identity in the librarian, so there is
  # no exemplar distance threshold.
  dedup_policy:
    _target_: gigaevo.memory.write.merge.DedupPolicy
    online_top_k: 5
    max_cards_per_diff: 3
    consolidation_k: 5
  # Novelty-admission gate: an LLM judge rejects freshly-authored idea cards that
  # a strong model would already reach for unprompted (the bank's binding
  # constraint is an excess of prior-known cards, not plumbing). One extra
  # memory-LLM hop per authored insight card; fails open on judge error. Insight
  # cards only — program exemplars carry concrete code+fitness and dedup by exact
  # code identity, so prose-novelty is the wrong axis for them.
  novelty_admission_gate: true
  prompts_dir: ${prompts.dir}
