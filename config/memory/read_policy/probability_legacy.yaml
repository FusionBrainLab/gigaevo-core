# @package memory
# Simple probability-only baseline.
#
# Global Beta-Binomial reputation, probability Thompson auction, theta-ranked
# budget. Useful for debugging and old safety-only ablations; not the default
# because it discards gain magnitude and context.
defaults:
  - /memory/reputation: beta_binomial
  - /memory/auction: thompson
  - /memory/budget: top_theta
  - /memory/excluder: lineage
  - _self_

reader:
  shortlister:
    _target_: gigaevo.memory.read.fused.FusedRankingShortlister
    inner:
      _target_: gigaevo.memory.read.shortlist.ResearchShortlister
      store: ${ref:memory.store}
      # Planner bank digest size. This probability-only baseline has no EV
      # bench; the digest only helps the retrieval planner avoid obvious misses.
      digest_max_cards: 50
    reputation: ${ref:memory.reputation}
    # Preserve LLM research order. If enabled, `w_rep` ranks by p_help_lo20
    # probability only; no gain magnitude enters this baseline.
    w_sem: 1.0
    w_rep: 0.0
    w_nov: 0.0
