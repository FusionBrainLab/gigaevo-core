# @package memory
# Legacy/contextual median-EV ablation.
#
# Uses BD-local Beta reputation plus the older theta x median-gain EV auction.
# Kept for comparisons; bootstrap policies are preferred for new runs because
# they see raw gain tails instead of a median-only magnitude.
defaults:
  - /memory/reputation: bd_proximity
  - /memory/auction: thompson_ev
  - /memory/budget: top_bid
  - /memory/excluder: lineage
  - _self_

reader:
  shortlister:
    _target_: gigaevo.memory.read.fused.FusedRankingShortlister
    inner:
      _target_: gigaevo.memory.read.shortlist.ResearchShortlister
      store: ${ref:memory.store}
      # Planner bank digest size. This legacy policy has no bootstrap EV bench,
      # so this is only retrieval-planner context.
      digest_max_cards: 50
    reputation: ${ref:memory.reputation}
    # Preserve the LLM research order by default. `w_rep` ranks by the old
    # probability lower bound (`p_help_lo20`), not EV; `w_nov` favors cards with
    # fewer recent events. Both are ablation knobs.
    w_sem: 1.0
    w_rep: 0.0
    w_nov: 0.0
