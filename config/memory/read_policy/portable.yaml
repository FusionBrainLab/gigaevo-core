# @package memory
# Portable bootstrap-EV read policy for multi-island or no-BD algorithms.
#
# Same bootstrap auction/benching/lineage behavior as the recommended policy,
# but global reputation avoids the single shared `behavior_space` dependency.
defaults:
  - /memory/context: global
  - /memory/prior: empirical_bayes
  - /memory/no_card_evidence: json
  - /memory/probe: cold_budget
  - /memory/reputation: bootstrap_global
  - /memory/auction: thompson_bootstrap
  - /memory/budget: top_bid
  - /memory/excluder: lineage
  - _self_

reader:
  shortlister:
    _target_: gigaevo.memory.read.fused.BootstrapFusedRankingShortlister
    inner:
      _target_: gigaevo.memory.read.shortlist.ResearchShortlister
      store: ${ref:memory.store}
      # How many newest cards the retrieval planner sees as a one-line bank
      # digest before vector search. This is planner context, not the auction
      # candidate width; that lives at memory.store.config.research.max_cards.
      digest_max_cards: 50
    reputation: ${ref:memory.reputation}
    store: ${ref:memory.store}
    context_model: ${ref:memory.context_model}
    # Keep semantic LLM research order by default. Reputation/novelty weights
    # are explicit ablation knobs; do not tune them unless comparing rankers.
    w_sem: 1.0
    w_rep: 0.0
    w_nov: 0.0
    # Warm-card bench floor over pessimistic bootstrap EV. It excludes known
    # low/negative-EV cards from digest/retrieval while keeping cold cards
    # visible for first-use exploration. Higher = stricter bank hygiene.
    rep_floor_quantile: 0.4
