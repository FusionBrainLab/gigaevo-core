# @package memory
# Experimental portable double-ageing bootstrap policy.
#
# Global bootstrap-EV plus posterior/count decay. Prefer `portable` unless a
# bank-health audit shows stale known cards staying overconfident for too long.
defaults:
  - /memory/reputation: bootstrap_global_decay
  - /memory/auction: thompson_bootstrap
  - /memory/budget: top_bid
  - /memory/excluder: lineage
  - _self_

reader:
  shortlister:
    _target_: gigaevo.memory.read.fused.BootstrapFusedRankingShortlister
    inner:
      _target_: gigaevo.memory.read.shortlist.ResearchShortlister
      store: ${ref:memory.store}
      # Planner bank digest size; independent from vector top-k and injection
      # budget.
      digest_max_cards: 50
    reputation: ${ref:memory.reputation}
    store: ${ref:memory.store}
    # Keep LLM research order by default. Change only when testing fused ranker
    # weights separately from decay behavior.
    w_sem: 1.0
    w_rep: 0.0
    w_nov: 0.0
    # Warm-card bootstrap-EV bench floor. Higher prunes more stale/low-EV known
    # cards; cold cards still pass so new ideas can be tried once.
    rep_floor_quantile: 0.4
