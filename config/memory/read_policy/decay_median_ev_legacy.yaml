# @package memory
# Legacy median-EV with posterior/count decay.
#
# Explicit decay experiment for the old median-EV stack. Useful as an ablation
# against bootstrap staleness; not recommended as the default.
defaults:
  - /memory/reputation: bd_proximity_decay
  - /memory/auction: thompson_ev
  - /memory/budget: top_bid
  - /memory/excluder: lineage
  - _self_

reader:
  shortlister:
    _target_: gigaevo.memory.read.fused.FusedRankingShortlister
    inner:
      _target_: gigaevo.memory.read.shortlist.ResearchShortlister
      store: ${ref:memory.store}
      # Planner bank digest size. No bootstrap bench in this legacy policy.
      digest_max_cards: 50
    reputation: ${ref:memory.reputation}
    # Preserve LLM research order. `w_rep` reads probability lower bound, not
    # bootstrap EV; use only for ranker ablations.
    w_sem: 1.0
    w_rep: 0.0
    w_nov: 0.0
