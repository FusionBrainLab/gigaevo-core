# @package memory
# Top-1 default read policy for single-island / BD tasks.
#
# Contextual bootstrap-EV is the current best bandit default: BD-local credit
# assignment, tail-aware expected-gain pricing, bank-cycle EV staleness, top-bid
# budgeting, warm-card benching, and lineage exclusion.
defaults:
  - /memory/context: bd_cell
  - /memory/prior: empirical_bayes
  - /memory/no_card_evidence: json
  - /memory/probe: cold_budget
  - /memory/reputation: bootstrap_bd
  - /memory/auction: thompson_bootstrap
  - /memory/budget: top_bid
  - /memory/excluder: lineage
  - _self_

reader:
  shortlister:
    _target_: gigaevo.memory.read.fused.BootstrapFusedRankingShortlister
    inner:
      _target_: gigaevo.memory.read.shortlist.ResearchShortlister
      store: ${ref:memory.store}
      # How many newest cards the retrieval planner sees as a one-line bank
      # digest before it writes vector-search queries. Larger = more planner
      # context/token cost; smaller = less awareness of recent cards.
      digest_max_cards: 50
    reputation: ${ref:memory.reputation}
    store: ${ref:memory.store}
    context_model: ${ref:memory.context_model}
    # Fused post-research ranking weights. Defaults keep the LLM research order:
    # semantic rank on, explicit reputation/novelty reordering off. Turn on
    # w_rep/w_nov only for ablations; the bench below already removes known
    # non-positive-EV cards before retrieval.
    w_sem: 1.0
    w_rep: 0.0
    w_nov: 0.0
    # Warm-card bench floor: compute every warm card's pessimistic bootstrap EV
    # (`IntroGain_bootstrap_ev_lo20`) in the current bank and exclude the bottom
    # q before research. Cold/no-delta cards are not benched, so exploration
    # remains open. Higher = more aggressive pruning.
    rep_floor_quantile: 0.4
