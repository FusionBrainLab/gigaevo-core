# @package memory
# Adaptive default read policy for single-island / BD tasks.
#
# Contextual bootstrap-EV remains the exploitation core. Adaptive adds:
# - context-shared evidence aggregation (BD cell with global fallback),
# - empirical-Bayes cold-card priors,
# - persisted no-card evidence for the auction abstention gate,
# - explicit cold probes so unknown cards do not become zombies.
defaults:
  - /memory/context: bd_cell
  - /memory/prior: empirical_bayes
  - /memory/no_card_evidence: json
  - /memory/probe: cold_budget
  - /memory/reputation: bootstrap_bd
  - /memory/auction: thompson_bootstrap
  - /memory/budget: top_bid
  - /memory/excluder: lineage
  - _self_

reader:
  shortlister:
    _target_: gigaevo.memory.read.fused.BootstrapFusedRankingShortlister
    inner:
      _target_: gigaevo.memory.read.shortlist.ResearchShortlister
      store: ${ref:memory.store}
      digest_max_cards: 50
    reputation: ${ref:memory.reputation}
    store: ${ref:memory.store}
    context_model: ${ref:memory.context_model}
    w_sem: 1.0
    w_rep: 0.0
    w_nov: 0.0
    rep_floor_quantile: 0.4
