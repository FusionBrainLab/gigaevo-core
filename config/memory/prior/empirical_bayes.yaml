# @package memory.prior
# Adaptive cold-card prior. It learns global -> kind -> category priors from
# first non-founding exposures, then adds context-local cohorts when the context
# model has a non-global key. Local BD priors use local evidence only, so other
# cells do not leak into a local cold-card belief; they still shape the global
# parent prior.
_target_: gigaevo.memory.read.prior.EmpiricalBayesMemoryPrior
store: ${ref:memory.store}
context_model: ${ref:memory.context_model}
# Cohort refinement ladder below the implicit global top level; each entry is a
# '+'-joined subset of {kind, category, context, task}. Global levels precede
# context-bearing levels and each block must refine monotonically.
# Context levels are task-local because BD cells are meaningful only within a task.
levels:
  - kind
  - kind+category
  - task+kind+category
  - context
  - context+kind
  - context+kind+category
  - task+context+kind+category
# Neutral weak seed for cold-card efficacy. This is deliberately weaker than
# memory.baseline_prior because EB should adapt from bank evidence quickly.
seed_prior: [1.0, 1.0]
k_min: 2.0
k_max: 6.0
n_ref: 32.0
shrink_events: 16.0
first_exposure_only: true
min_parameter: 0.25
