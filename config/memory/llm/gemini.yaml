# Memory-subsystem LLM router (OpenRouter Gemini Flash) — the default writer/
# enrichment model (cheaper than evolution's). Swap with `memory/llm=qwen_instruct`.
_target_: gigaevo.llm.models.MultiModelRouter
_convert_: all
name: memory
models:
  - _target_: langchain_openai.ChatOpenAI
    model: google/gemini-3-flash-preview
    api_key: ${oc.env:OPENROUTER_API_KEY}
    base_url: https://openrouter.ai/api/v1
    temperature: 0.0
    max_tokens: null
    extra_body:
      reasoning:
        effort: minimal
probabilities:
  - 1.0
max_concurrent: 100
writer: ${ref:writer}
# auto: negotiate json_schema -> function_calling -> json_mode per endpoint and
# cache the winner, so this one router serves OpenRouter Gemini and the in-cluster
# Qwen vLLM proxy (which rejects forced tool_choice) without per-run tuning.
structured_output_method: auto
