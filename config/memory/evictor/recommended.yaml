# @package memory.evictor
# Recommended write-side deletion policy:
# 1. reject catastrophic founding failures before they can behave like cold cards;
# 2. evict cards whose later use evidence is confidently harmful;
# 3. retire cards the active read policy has made non-viable before the harm
#    posterior can collect more samples.
#
# Birth failure uses the primary metric's `significant_change` as its scale.
# With the default multiplier 2.0, a card born from a child that regressed by at
# least two meaningful-change quanta is deleted unless later direct evidence has
# already rescued it.
_target_: gigaevo.memory.write.eviction.CompositeEvictor
evictors:
  - _target_: gigaevo.memory.write.eviction.CrossTaskRetentionGuard
    task_key: ${problem.name}
    min_effective_events: ${memory.evidence.min_effective_events}
    inner:
      _target_: gigaevo.memory.write.eviction.BirthFailureEvictor
      task_key: ${problem.name}
      scorer: ${ref:memory.reputation}
      metrics_context: ${ref:problem_context::metrics_context}
      scale: null
      scale_multiplier: 2.0
      rescue_min_events: ${memory.evidence.min_effective_events}
      rescue_p_help_threshold: 0.5
      rescue_ev_threshold: 0.0
  - _target_: gigaevo.memory.write.eviction.CrossTaskRetentionGuard
    task_key: ${problem.name}
    min_effective_events: ${memory.evidence.min_effective_events}
    inner:
      _target_: gigaevo.memory.write.eviction.HarmEvictor
      task_key: ${problem.name}
      scorer: ${ref:memory.reputation}
      # Positive-EV veto: spare a card whose optimistic bootstrap EV band still
      # clears this neutral point. The sign-based harm gate is magnitude-blind,
      # so a fat-tailed winner can read confidently harmful yet have positive EV;
      # the irreversible tombstone must not delete it.
      neutral_gain: ${memory.neutral_gain}
      # Same staleness-aged evidence floor the read/probe lane uses, so a
      # probe-eligible (aged-cold) card is never harm-tombstoned by the writer.
      min_effective_events: ${memory.eviction_safety.min_effective_events}
      skip_contextual_without_context: ${memory.eviction_safety.skip_contextual_without_context}
  - _target_: gigaevo.memory.write.eviction.CrossTaskRetentionGuard
    task_key: ${problem.name}
    min_effective_events: ${memory.evidence.min_effective_events}
    inner:
      _target_: gigaevo.memory.write.eviction.PolicyNonViableEvictor
      task_key: ${problem.name}
      scorer: ${ref:memory.reputation}
      # Derived from the active memory preset's baseline-adjusted reward origin.
      neutral_gain: ${memory.neutral_gain}
      # Shared evidence floor for all recommended eviction policies.
      min_effective_events: ${memory.eviction_safety.min_effective_events}
      # Contextual scorers expose explicit evidence contexts. If a custom scorer
      # cannot provide them, skip contextless cleanup instead of falling back to a
      # potentially unsafe global view.
      skip_contextual_without_context: ${memory.eviction_safety.skip_contextual_without_context}
