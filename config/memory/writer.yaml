# memory=writer — write only (seed a card bank for a later `memory=reader`
# run; the deliberate "build a bank" move). The read side is unmounted: no
# store/reader nodes, the provider injects nothing. Reputation is still
# mounted — it is the recommended evictor's scorer, pure math over stamped gain
# events plus birth-failure admission. NOTE: this spends memory-LLM tokens — see
# gigaevo/memory/README.md.
defaults:
  - llm: gemini
  - context: global
  - no_card_evidence: json
  - reputation: beta_binomial
  - evictor: recommended
  - write: end_of_run
  - _self_

capabilities:
  read: false
  write: true

# Neutral point for baseline-adjusted card gain. Use-attributed gains are
# child-parent deltas after subtracting the no-card baseline, so this value is
# the no-card counterfactual origin, not a task-specific metric threshold.
neutral_gain: 0.0

provider:
  _target_: gigaevo.memory.provider.NullMemoryProvider

# The store the writer fills (bank + vector index under the run's checkpoint
# dir). Owned here so a later `memory=reader` run can cold-load the bank.
store:
  _target_: gigaevo.memory.storage.local.LocalMemoryStore
  config:
    _target_: gigaevo.memory.storage.config.StoreConfig
    path: ${checkpoint_dir}
  llm: ${ref:memory.llm}
  prompts_dir: ${prompts.dir}

writer:
  _target_: gigaevo.memory.write.writer.MemoryWriter
  llm: ${ref:memory.llm}
  evictor: ${ref:memory.evictor}
  store: ${ref:memory.store}
  checkpoint_dir: ${checkpoint_dir}
  metrics_context: ${ref:problem_context::metrics_context}
  baseline_estimator: ${ref:memory.context_model}
  no_card_recorder: ${ref:memory.no_card_evidence}
  task_description: ${ref:problem_context::task_description}
  best_programs_percent: 5.0
  ingest_call_timeout_s: 300.0
  consolidation_every_n: 32
  dedup_policy:
    _target_: gigaevo.memory.write.merge.DedupPolicy
    online_top_k: 5
    max_cards_per_diff: 3
    consolidation_k: 5
  # Program exemplar controls: exact normalized-source identity via code hash,
  # bounded authoring per refresh, and a hard total archive cap. No prose/word
  # similarity is used for exemplar dedup.
  program_exemplars:
    _target_: gigaevo.memory.write.merge.ProgramExemplarPolicy
    enabled: true
    top_k_per_refresh: 4
    max_cards: 12
    min_fitness_gap: 0.0
    store_code: false
  prompts_dir: ${prompts.dir}
