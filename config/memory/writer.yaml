# memory=writer — write only (seed a card bank for a later `memory=reader`
# run; the deliberate "build a bank" move). The read side is unmounted: no
# store/reader nodes, the provider injects nothing. Reputation is still
# mounted — it is the harm evictor's scorer, pure math over stamped gain
# events. NOTE: this spends memory-LLM tokens — see gigaevo/memory/README.md.
defaults:
  - llm: gemini
  - reputation: beta_binomial
  - evictor: harm
  - _self_

provider:
  _target_: gigaevo.memory.provider.NullMemoryProvider

# The store the writer fills (bank + vector index under the run's checkpoint
# dir). Owned here so a later `memory=reader` run can cold-load the bank.
store:
  _target_: gigaevo.memory.storage.local.LocalMemoryStore
  config:
    _target_: gigaevo.memory.storage.config.StoreConfig
    path: ${checkpoint_dir}
  llm: ${ref:memory.llm}
  prompts_dir: ${prompts.dir}

writer:
  _target_: gigaevo.memory.write.writer.MemoryWriter
  llm: ${ref:memory.llm}
  evictor: ${ref:memory.evictor}
  store: ${ref:memory.store}
  checkpoint_dir: ${checkpoint_dir}
  metrics_context: ${ref:problem_context::metrics_context}
  task_description: ${ref:problem_context::task_description}
  best_programs_percent: 5.0
  ingest_call_timeout_s: 300.0
  consolidation_every_n: 32
  dedup_policy:
    _target_: gigaevo.memory.write.merge.DedupPolicy
    online_top_k: 5
    max_cards_per_diff: 3
    consolidation_k: 5
  prompts_dir: ${prompts.dir}
