# _convert_: all is
# required — CardUpdateDedupConfig's before-validator silently ignores DictConfig.
_target_: gigaevo.memory.core.deduplicator.LLMDeduplicator
_convert_: all
config:
  _target_: gigaevo.memory.shared_memory.card_update_dedup.CardUpdateDedupConfig
  enabled: true
  top_k_per_query: 10
  final_top_n: 10
  min_final_score: 0.05
  llm_max_retries: 2
  weights:
    description: 0.35
    explanation_summary: 0.2
    description_explanation_summary: 0.3
    description_task_description_summary: 0.15
