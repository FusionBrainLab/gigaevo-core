# @package memory.auction
# Bootstrap-EV Thompson auction (the `memory=full` default). Same no-card
# safety gate as `memory/auction=thompson_ev`, but each candidate bids the mean
# of ONE weighted bootstrap resample of known-card deltas plus a neutral zero
# pseudo-event. Genuinely cold cards instead bid posterior × round borrowed gain
# scale. This prices the whole distribution, not a binarized p_help x median, so
# a fat left tail bids negative. Staleness rides the per-event resample weight
# (the one bank-cycle mechanism). The EV reserve
# `ev_floor_quantile` is the quantile of the round's OWN bid distribution
# clamped at zero — self-normalizing, no Beta assumption, and the clamp keeps
# the abstain-on-all-harmful guarantee. Pairs with
# `memory/budget=top_bid` and bootstrap reputation.
_target_: gigaevo.memory.read.auction.BootstrapThompsonAuctioneer
# Fallback no-card baseline arm prior. Adaptive policies may replace this per
# read with persisted no-card evidence through the candidate projector.
baseline_prior: ${memory.baseline_prior}
# Task metrics context; primary metric significant_change is used only as the
# cold gain scale fallback when no warm positive card exists in a round.
metrics_context: ${ref:problem_context::metrics_context}
# Round-relative EV reserve: candidate bid must be positive and at/above this
# quantile of the current round's own bids. Provenance: heilbron evalB/evalD
# offline calibration (2026-07-05, n=27 high-value A-injections) chose q=0.765,
# targeting the ~30-40% high-precision injection regime.
ev_floor_quantile: 0.765
