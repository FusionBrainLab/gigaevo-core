# Calibrated cold-card prior for the EV Thompson auction. Same no-card gate and
# `ev_floor` as `auction=thompson_ev`, but a cold card (no stamped magnitude) bids
# the `cold_quantile` (median) of the proven magnitudes on its OWN slate instead
# of a fixed `prior_magnitude`, so the cold bid tracks the substrate fitness scale
# with no per-task tuning. All-cold slates fall back to `cold_floor` and the plain
# Thompson safety gate. Remediation #1 from docs/audits/bandit_health_report.md (RQ1).
_target_: gigaevo.memory.core.calibrated_auctioneer.CalibratedColdPriorAuctioneer
baseline_prior: [3.0, 3.0]
ev_floor: 0.0
cold_quantile: 0.5
cold_floor: 1.0e-6
