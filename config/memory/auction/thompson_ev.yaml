# @package memory.auction
# EV-bid Thompson auction (the `thompson_ev` arm). Same no-card abstain gate as
# `memory/auction=thompson`, but bids theta x magnitude so `memory/budget=top_bid`
# ranks winners by expected gain. `ev_floor` abstains on non-positive expected
# gain (never inject a card you expect to hurt). A cold card (no stamped
# magnitude) borrows a gain scale: the in-round warm-magnitude median, else the
# primary metric's `significant_change` from `metrics_context` — so the floor
# never strands a fresh card on the task's own gain scale.
_target_: gigaevo.memory.read.auction.EVThompsonAuctioneer
baseline_prior: [3.0, 3.0]
metrics_context: ${ref:problem_context::metrics_context}
ev_floor: 0.0
