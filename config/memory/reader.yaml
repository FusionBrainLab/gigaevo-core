# memory=reader — read only (inject cards from a pre-seeded bank, no writer).
# Same read graph as `memory=full` with the write side unmounted: no evictor,
# no librarian, and the post-run hook is a no-op. Point `checkpoint_dir` at a
# bank a prior `memory=writer` (or `memory=full`) run filled.
defaults:
  - llm: gemini
  - reputation: beta_binomial
  - auction: thompson_ev
  - budget: top_bid
  - excluder: none
  - _self_

store:
  _target_: gigaevo.memory.storage.local.LocalMemoryStore
  config:
    _target_: gigaevo.memory.storage.config.StoreConfig
    path: ${checkpoint_dir}
  llm: ${ref:memory.llm}
  prompts_dir: ${prompts.dir}

reader:
  _target_: gigaevo.memory.read.reader.MemoryReader
  shortlister:
    _target_: gigaevo.memory.read.shortlist.ResearchShortlister
    store: ${ref:memory.store}
  reputation: ${ref:memory.reputation}
  auctioneer: ${ref:memory.auction}
  budgeter: ${ref:memory.budget}
  renderer:
    _target_: gigaevo.memory.read.render.EfficacyCardRenderer
  max_cards: 1

provider:
  _target_: gigaevo.memory.provider.ReaderMemoryProvider
  reader: ${ref:memory.reader}
  excluder: ${ref:memory.excluder}

writer:
  _target_: gigaevo.evolution.engine.hooks.NullPostRunHook
