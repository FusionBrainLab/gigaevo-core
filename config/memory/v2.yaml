# memory=v2: v1 card machinery with a contextual Bayesian causal core.
# The initial production scope is bounded, singleton-parent MAP-Elites evolution.
# Multi-parent crossover is rejected until decisions move to mutation level.
defaults:
  - llm: gemini
  - context: global
  - no_card_evidence: none
  - excluder: lineage
  - write: live
  - _self_

# Start producing cards early enough for a 250-mutation run to evaluate them.
# The shared v1 live-writer cadence remains ten successful ingestor sweeps.
write:
  refresh_every: 5

capabilities:
  read: true
  write: true
  causal_v2: true

run_seed: 0
# A causal decision is scoped to one mutation attempt. Reusing a cached parent
# assignment across concurrent mutations would give one decision multiple outcomes.
coalesce_refresh: false

neutral_gain: 0.0
baseline_prior: [3.0, 3.0]
evidence:
  min_effective_events: 3

evictor:
  _target_: gigaevo.memory_v2.eviction.CausalPosteriorEvictor
  ledger: ${ref:memory.ledger}
  posterior: ${ref:memory.posterior}
  safety: ${ref:memory.safety}
  min_treated: 2
  min_control: 2
  min_distinct_contexts: 2
  posterior_samples: 4096
  max_viability_probability: 0.05
  mc_confidence_z: 2.576

environment:
  _target_: gigaevo.memory_v2.models.EnvironmentFingerprint
  task_key: ${problem.name}
  problem_name: ${problem.name}
  llm:
    _target_: gigaevo.memory_v2.models.LLMFingerprint
    model_name: ${model_name}
    base_url: ${llm_base_url}
    temperature: ${temperature}
  mutation_operator: ${get_object:${mutation_operator._target_}}
  program_format: ${program_format.id}
  pipeline: ${pipeline.id}
  algorithm: ${hydra:runtime.choices.algorithm}

map_context_config:
  _target_: gigaevo.memory_v2.context.MapContextConfig
  neighbor_radius: 1

credit:
  _target_: gigaevo.memory_v2.models.LineageCreditConfig
  # Depth 1 is the original immediate-child endpoint. Larger depths use one
  # best-descendant outcome per randomized decision after a fixed number of
  # mutation opportunities in the root's pre-treatment MAP-Elites island.
  lineage_depth: 3
  opportunity_budget: 32

context_source:
  _target_: gigaevo.memory_v2.context.MapElitesContextSource
  strategy: ${ref:evolution_strategy}
  metrics_context: ${ref:problem_context::metrics_context}
  environment: ${ref:memory.environment}
  config: ${ref:memory.map_context_config}
  credit: ${ref:memory.credit}
  trajectory_id_source: ${ref:memory.ledger}

ledger:
  _target_: gigaevo.memory_v2.ledger.SqliteCausalLedger
  path: ${checkpoint_dir}/memory_v2_evidence.sqlite3
  environment: ${ref:memory.environment}

outcome_sink: ${ref:memory.ledger}

feature_config:
  _target_: gigaevo.memory_v2.features.FeatureConfig
  # The live BehaviorSpace owns the ordered statistical axes and transforms.
  behavior_keys: ${ref:memory.context_source::behavior_keys}
  progress_log_scale: 100.0
  # Card kind is durable action metadata, unlike free-form tags. A single
  # program-minus-insight contrast shares evidence across exact card lineages.
  card_kind_contrast: true

feature_map:
  _target_: gigaevo.memory_v2.features.HierarchicalFeatureMap
  config: ${ref:memory.feature_config}

posterior_config:
  _target_: gigaevo.memory_v2.posterior.TerminalUtilityPosteriorConfig
  baseline_prior_sd: 0.75
  shared_effect_prior_sd: 0.35
  card_effect_prior_sd: 0.25
  reward_residual_sd_initial: 0.20
  reward_residual_log_prior_sd: 0.75
  reward_residual_mode_grid_points: 17
  reward_residual_quadrature_mass_rtol: 1.0e-5
  reward_residual_moment_rtol: 1.0e-3
  reward_coefficient_mean_tolerance: 1.0e-3
  reward_residual_upper_boundary_mass_limit: 1.0e-4
  reward_residual_quadrature_max_depth: 8
  unknown_measurement_sd: 0.15
  # Ordinary runs use 70/30 delivery/control after a balanced validation run.
  # Validation launchers override both reference and policy probabilities to 0.50.
  reference_offer_probability: 0.70
  safety_integration_tolerance: 1.0e-8
  invalidity_prior_probability: 0.05
  safety_baseline_prior_sd: 0.15
  safety_shared_effect_prior_mean: 0.0
  safety_shared_effect_prior_sd: 0.20
  safety_card_effect_prior_sd: 0.60

posterior:
  _target_: gigaevo.memory_v2.posterior.HierarchicalTerminalUtilityPosterior
  feature_map: ${ref:memory.feature_map}
  config: ${ref:memory.posterior_config}

safety:
  _target_: gigaevo.memory_v2.policy.SafetyConstraint
  gate_mode: exclude_confident_incremental_harm
  max_treated_invalid_probability: null
  max_incremental_invalid_probability: 0.10
  alpha: 0.10

policy_config:
  _target_: gigaevo.memory_v2.policy.ProbabilityMatchingConfig
  offer_probability: 0.70
  proposal_exploration_probability: 0.05
  posterior_summary_samples: 1024
  proposal_worlds: 512
  abstain_effect: 0.0
  max_pending_per_card: 2

policy:
  _target_: gigaevo.memory_v2.policy.ChanceConstrainedProbabilityMatchingPolicy
  safety: ${ref:memory.safety}
  config: ${ref:memory.policy_config}

store:
  _target_: gigaevo.memory.storage.local.LocalMemoryStore
  config:
    _target_: gigaevo.memory.storage.config.StoreConfig
    path: ${checkpoint_dir}
    research:
      _target_: gigaevo.memory.storage.config.ResearchConfig
      default_top_k: 8
      max_iters: 1
      max_cards: 8
  llm: ${ref:memory.llm}
  prompts_dir: ${prompts.dir}

shortlister:
  _target_: gigaevo.memory.read.shortlist.ResearchShortlister
  store: ${ref:memory.store}
  digest_max_cards: 50

candidate_source:
  _target_: gigaevo.memory_v2.candidates.AgenticCandidateSource
  store: ${ref:memory.store}
  shortlister: ${ref:memory.shortlister}
  excluder: ${ref:memory.excluder}
  allow_cross_task: false
  allowed_kinds: [insight, program]
  # One agentically researched core plus uniform discovery keeps every eligible
  # card reachable without making the Bayesian selector compare the whole bank.
  max_candidates: 12
  exploration_candidates: 4
  # Keep the random tail at the declared budget and reserve most proposal
  # probability for the researched core. Historical ledgers omit this key and
  # retain the original fill-all-unused-slots behavior.
  selection_logic: core_priority
  mutation_mode: ${mutation_mode}
  # Fail open before the parent-refresh deadline if the retrieval LLM stalls.
  research_timeout_seconds: 240.0

renderer:
  _target_: gigaevo.memory_v2.render.ImmutableCardRenderer

provider:
  _target_: gigaevo.memory_v2.provider.CausalBanditMemoryProvider
  candidate_source: ${ref:memory.candidate_source}
  context_source: ${ref:memory.context_source}
  ledger: ${ref:memory.ledger}
  posterior: ${ref:memory.posterior}
  policy: ${ref:memory.policy}
  renderer: ${ref:memory.renderer}
  store: ${ref:memory.store}
  selection_leases: ${ref:selection_leases}
  task_key: ${problem.name}
  run_seed: ${memory.run_seed}

context_model:
  task_key: ${problem.name}

causal_writer_updater:
  _target_: gigaevo.memory_v2.writer.CausalV2ContentOnlyUpdater
  ledger: ${ref:memory.ledger}
  selection_leases: ${ref:selection_leases}

writer:
  _target_: gigaevo.memory.write.writer.MemoryWriter
  llm: ${ref:memory.llm}
  evictor: ${ref:memory.evictor}
  store: ${ref:memory.store}
  checkpoint_dir: ${checkpoint_dir}
  task_key: ${problem.name}
  metrics_context: ${ref:problem_context::metrics_context}
  stats_updater: ${ref:memory.causal_writer_updater}
  task_description: ${ref:problem_context::task_description}
  best_programs_percent: 5.0
  ingest_call_timeout_s: 300.0
  consolidation_every_n: 32
  dedup_policy:
    _target_: gigaevo.memory.write.merge.DedupPolicy
    online_top_k: 5
    max_cards_per_diff: 3
    consolidation_k: 5
    preserve_survivor_payload: true
  program_exemplars:
    _target_: gigaevo.memory.write.merge.ProgramExemplarPolicy
    enabled: true
    top_k_per_refresh: 4
    max_cards: 32
    min_fitness_gap: 0.0
    store_code: false
  selection_leases: ${ref:selection_leases}
  min_effective_events: ${memory.evidence.min_effective_events}
  prompts_dir: ${prompts.dir}
