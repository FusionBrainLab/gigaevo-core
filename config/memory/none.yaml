# memory=none — baseline, both sides off. No component leaves are mounted:
# the provider injects nothing and the post-run hook is a no-op, so no memory
# LLM is billed. Every arm defines the same two consumer-facing nodes —
# pipelines read ${ref:memory.provider}, engines read ${ref:memory.writer}.
provider:
  _target_: gigaevo.memory.provider.NullMemoryProvider
writer:
  _target_: gigaevo.evolution.engine.hooks.NullPostRunHook
