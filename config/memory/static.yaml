# memory=static — reader-only static lever injection, writer off.
# Serves a fixed curated block of lever recipes into the same memory slot the
# dynamic system feeds (MutationSuggestionStage.memory_cards under
# pipeline=memory_guided) for every child; no bank, no embedder, no memory LLM is
# mounted (zero memory-LLM billing).
defaults:
  - write: none
  - _self_

capabilities:
  read: true
  write: false

provider:
  _target_: gigaevo.memory.provider.StaticLeverMemoryProvider
  levers_file: ???
  # Guards the treatment: a mangled `---` separator fails the launch instead
  # of silently running a merged/shrunken arm.
  expected_blocks: 6
outcome_sink:
  _target_: gigaevo.memory.outcomes.NullMemoryOutcomeSink
writer:
  _target_: gigaevo.evolution.engine.hooks.NullPostRunHook
