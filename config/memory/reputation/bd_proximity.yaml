# @package memory.reputation
# BD-cell partitioned reputation (selectable; the `memory=full` default policy is
# `recommended`, which wraps this class): buckets each card's gain events into the
# query parent's current MAP-Elites cell and bids over the in-cell subset only;
# a cold cell delegates to the global `fallback`. Requires a single-island
# algorithm that exposes a top-level `behavior_space` (single_island*,
# topology_3d*, tabular/2d_local_ood). `multi_island` defines per-island
# behavior spaces and is NOT compatible (validate_reputation_island_compat
# fails fast).
_target_: gigaevo.memory.read.reputation.BDProximityReputation
# Required shared behavior space. This preset is not compatible with multi-island
# algorithms that only expose per-island behavior spaces.
behavior_space: ${ref:behavior_space}
# Fallback used when the query parent's BD cell has no in-cell events for a card.
fallback:
  _target_: gigaevo.memory.read.reputation.BetaBinomialReputation
  # Harm/confidence thresholds and cold prior for cold cells.
  harm_min_events: ${memory.evidence.min_effective_events}
  harm_quantile: 0.80
  harm_threshold: 0.5
  confident_quantile: 0.20
  confident_threshold: 0.5
  cold_prior: ${memory.baseline_prior}
# Harm/confidence thresholds for in-cell BD evidence.
harm_min_events: ${memory.evidence.min_effective_events}
harm_quantile: 0.80
harm_threshold: 0.5
confident_quantile: 0.20
confident_threshold: 0.5
# Legacy cold no-evidence prior used when no candidate_projector prior is set.
cold_prior: ${memory.baseline_prior}
