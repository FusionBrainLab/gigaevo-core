# Requires a single-island algorithm that exposes a top-level `behavior_space`
# (single_island*, topology_3d*, tabular/2d_local_ood). `multi_island` defines
# fitness_/simplicity_behavior_space instead and is NOT compatible.
_target_: gigaevo.memory.core.bd_proximity.BDProximityReputation
behavior_space: ${ref:behavior_space}
fallback:
  _target_: gigaevo.memory.core.reward.RewardWeightedReputation
  reward:
    _target_: gigaevo.memory.core.reward.AbsoluteMedianReward
  harm_min_events: 3
  harm_quantile: 0.80
  harm_threshold: 0.5
  confident_quantile: 0.20
  confident_threshold: 0.5
  baseline_neighbors: 15
  noise_band_k: 1.0
  noise_floor_rel: 1.0e-4
  cold_prior: [1.0, 1.0]
harm_min_events: 3
harm_quantile: 0.80
harm_threshold: 0.5
confident_quantile: 0.20
confident_threshold: 0.5
baseline_neighbors: 15
noise_band_k: 1.0
noise_floor_rel: 1.0e-4
cold_prior: [1.0, 1.0]
