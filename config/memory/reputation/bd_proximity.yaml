# @package memory.reputation
# BD-cell partitioned reputation: buckets each card's gain events into the
# query parent's current MAP-Elites cell and bids over the in-cell subset only;
# a cold cell delegates to the global `fallback`. Requires a single-island
# algorithm that exposes a top-level `behavior_space` (single_island*,
# topology_3d*, tabular/2d_local_ood). `multi_island` defines per-island
# behavior spaces and is NOT compatible (validate_reputation_island_compat
# fails fast).
_target_: gigaevo.memory.read.reputation.BDProximityReputation
behavior_space: ${ref:behavior_space}
fallback:
  _target_: gigaevo.memory.read.reputation.BetaBinomialReputation
  harm_min_events: 3
  harm_quantile: 0.80
  harm_threshold: 0.5
  confident_quantile: 0.20
  confident_threshold: 0.5
  noise_band_k: 1.0
  cold_prior: [1.0, 1.0]
harm_min_events: 3
harm_quantile: 0.80
harm_threshold: 0.5
confident_quantile: 0.20
confident_threshold: 0.5
noise_band_k: 1.0
cold_prior: [1.0, 1.0]
