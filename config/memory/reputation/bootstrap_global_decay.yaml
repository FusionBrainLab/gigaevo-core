# @package memory.reputation
# Portable conservative-ageing preset: bootstrap-EV over decayed global reputation.
#
# Use for multi-island/no-BD runs where stale cards clog retrieval and you want
# posterior-count decay in addition to the default bootstrap-EV staleness decay.
# It is more exploratory than `bootstrap_global`; prefer that preset unless the
# bank shows stale known cards staying overconfident for too long.
_target_: gigaevo.memory.read.reputation.BootstrapReputation
store: ${ref:memory.store}
# Outer bootstrap-EV staleness half-life in bank cycles.
half_life_cycles: 1.0
# Pessimistic EV quantile used by the bootstrap warm-card bench.
ev_lo_quantile: 0.20
# Deterministic resamples for per-card stats.
n_bootstrap: 512
# Effective non-stale use-event count required before confidence can be true.
confident_min_events: 3
inner:
  _target_: gigaevo.memory.read.decay.DecayingReputation
  store: ${ref:memory.store}
  # Inner Beta posterior/count decay half-life. Stacks with bootstrap EV decay.
  half_life_cycles: 1.0
  inner:
    _target_: gigaevo.memory.read.reputation.BetaBinomialReputation
    # Harm/confidence thresholds and aligned cold prior for global evidence.
    harm_min_events: 3
    harm_quantile: 0.80
    harm_threshold: 0.5
    confident_quantile: 0.20
    confident_threshold: 0.5
    cold_prior: [3.0, 3.0]
