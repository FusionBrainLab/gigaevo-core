# @package memory.reputation
# BD-proximity reputation with bank-cycle staleness decay: same cell-local
# value channel as `bd_proximity`, but event i is discounted by
# w_i = 2^(-s_i/H), where s_i counts native bank events newer than its own stamp
# and H = task population x half_life_cycles. Benched cards drift toward neutral
# evidence (magnitude expires below one effective event, the harm gate's
# min-events requirement expires with it) instead of staying frozen forever.
# Opt-in: no preset selects this group by default (`memory/reputation=
# bd_proximity_decay` to enable); rank-based and self-normalizing, no absolute
# constants.
_target_: gigaevo.memory.read.decay.DecayingReputation
store: ${ref:memory.store}
# Posterior/count staleness half-life in task-bank cycles. One cycle ~= current
# task population newer native events. 1.0 halves an event after one such turn.
half_life_cycles: 1.0
inner:
  _target_: gigaevo.memory.read.reputation.BDProximityReputation
  # Required shared behavior space; use bootstrap_global/portable policies for
  # multi-island or no-BD algorithms.
  behavior_space: ${ref:behavior_space}
  # Fallback used when the query parent's BD cell has no in-cell events.
  fallback:
    _target_: gigaevo.memory.read.reputation.BetaBinomialReputation
    # Harm/confidence thresholds and cold prior for cold cells.
    harm_min_events: ${memory.evidence.min_effective_events}
    # Optimistic posterior quantile of P(not harmful) for the harm gate. 0.95 (not
    # 0.80): the harm tombstone is irreversible for the run and re-checked after
    # every event, so a conservative bar avoids a multiple-looks false tombstone on
    # marginal 3-loss evidence.
    harm_quantile: 0.95
    harm_threshold: 0.5
    confident_quantile: 0.20
    confident_threshold: 0.5
    # Share the selected cold prior with warm counts (fixed_3_3 warms from Beta(3,3)).
    prior: ${ref:memory.prior}
    cold_prior: ${memory.baseline_prior}
  # Harm/confidence thresholds for in-cell BD evidence.
  harm_min_events: ${memory.evidence.min_effective_events}
  # Same conservative 0.95 harm bar as the fallback above (irreversible run-long tombstone).
  harm_quantile: 0.95
  harm_threshold: 0.5
  confident_quantile: 0.20
  confident_threshold: 0.5
  # Share the selected cold prior with warm counts (fixed_3_3 warms from Beta(3,3)).
  prior: ${ref:memory.prior}
  cold_prior: ${memory.baseline_prior}
