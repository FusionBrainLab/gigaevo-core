# @package memory.reputation
# Portable bootstrap-EV preset: no behavior-space dependency.
#
# Use for multi-island algorithms, algorithms without a top-level
# `behavior_space`, or read-only banks where portability matters more than
# contextual BD credit. It keeps the same tail-aware bootstrap-EV pricing and
# cold prior as the default, but reputation is global across all parent
# contexts. Pairs with `memory/auction=thompson_bootstrap`.
_target_: gigaevo.memory.read.reputation.BootstrapReputation
store: ${ref:memory.store}
# Bootstrap-EV staleness half-life in bank cycles. Applies to raw gain deltas;
# no behavior-space dependency in this global preset.
half_life_cycles: 1.0
# Pessimistic EV quantile used by the bootstrap warm-card bench.
ev_lo_quantile: 0.20
# Deterministic resamples for per-card stats.
n_bootstrap: 512
# Effective non-stale use-event count required before confidence can be true.
confident_min_events: ${memory.evidence.min_effective_events}
inner:
  _target_: gigaevo.memory.read.reputation.BetaBinomialReputation
  # Harm gate and display-confidence thresholds for the global posterior.
  harm_min_events: ${memory.evidence.min_effective_events}
  harm_quantile: 0.80
  harm_threshold: 0.5
  confident_quantile: 0.20
  confident_threshold: 0.5
  # Share the selected cold prior with warm counts (fixed_3_3 warms from Beta(3,3)).
  prior: ${ref:memory.prior}
  # Legacy cold no-evidence prior used when no candidate_projector prior is set.
  cold_prior: ${memory.baseline_prior}
