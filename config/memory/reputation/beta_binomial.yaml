# @package memory.reputation
# Global downside Beta-Binomial reputation over per-card injection gains — the
# default value channel for the auction and the harm evictor's scorer.
_target_: gigaevo.memory.read.reputation.BetaBinomialReputation
# Minimum intro events before a card can be harm-evicted.
harm_min_events: ${memory.evidence.min_effective_events}
# Optimistic posterior quantile of P(not harmful) for the harm gate. 0.95 (not
# 0.80): the harm tombstone is irreversible for the run and re-checked after every
# event, so a conservative bar avoids a multiple-looks false tombstone on marginal
# 3-loss evidence.
harm_quantile: 0.95
# Harmful iff that optimistic P(not harmful) remains below this threshold.
harm_threshold: 0.5
# Pessimistic posterior quantile used for confidence/display.
confident_quantile: 0.20
# Confidence threshold on P(help) for the Beta posterior.
confident_threshold: 0.5
# Share the selected cold prior with warm counts (fixed_3_3 warms from Beta(3,3)).
prior: ${ref:memory.prior}
# Legacy cold no-evidence prior used when no candidate_projector prior is set.
cold_prior: ${memory.baseline_prior}
