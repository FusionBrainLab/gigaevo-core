# @package _global_

# Base Experiment - Simple Single Island Setup
# Perfect for getting started and local development

defaults:
  - /constants: base
  - /redis: default
  - /llm: single
  - /prompts: default
  - /prompt_fetcher: fixed
  - /evolution: default
  - /algorithm: single_island_no_distant_parents
  - /mutation: llm_rewrite
  - /pipeline: memory_guided
  - /runner: default
  - /scheduling: cached_first
  - /loader: directory
  - /logging: tensorboard
  - /metrics: default
  - /memory: v2

# Memory v2 assigns one intervention to one mutation attempt. Multi-parent
# crossover remains an explicit opt-in together with a compatible memory preset.
num_parents: 1
