# @package _global_
#
# Guided (no external memory) mutation pipeline + noise-aware per-sample
# score transport — the no-memory sibling of pipeline=memory_guided_noise.
#
# Wire-identical DAG to pipeline=guided; the CallValidatorFunction node runs
# ProgramMetadataValidatorStage instead, which pops
# artifact["_program_metadata"] (e.g. per_sample_scores from validate())
# onto program.metadata at eval time — the vector never enters the artifact
# stream, so mutation prompts are bit-identical to control.
#
# Pair with the paired replacement gate via archive_selector=paired_bootstrap
# and a validate() that returns (metrics, {"_program_metadata": {...}}),
# e.g. chains/hover/full7_vectorized. Combine with memory=none for a true
# no-memory noise arm.

defaults:
  - /pipeline_feature/archive_gate
  - _self_

pipeline:
  id: guided_noise
  reads_external_memory: false
  routes_program_metadata: true

evolution_context:
  _target_: gigaevo.entrypoint.evolution_context.EvolutionContext
  problem_ctx: ${problem_context}
  llm_wrapper: ${ref:llm}
  storage: ${ref:program_storage}
  prompts_dir: ${prompts.dir}
  prompt_fetcher: ${prompt_fetcher}
  memory_provider: ${ref:memory.provider}

pipeline_builder:
  _target_: gigaevo.entrypoint.noise_aware_pipeline.NoiseAwareGuidedPipelineBuilder
  ctx: ${evolution_context}
  stage_timeout: ${stage_timeout}
  dag_timeout: ${dag_timeout}
  max_parallel: ${dag_concurrency}
  max_insights: ${max_insights}
  max_code_length: ${max_code_length}
  intra_max_children: 24
  mutation_mode: ${mutation_mode}
  enable_optuna_stage: ${enable_optuna_stage}
  optimization_time_budget: ${optimization_time_budget}
  program_format_feature: ${ref:program_format.evaluation_feature}
  enable_chain_structural_metrics: ${enable_chain_structural_metrics}

dag_blueprint:
  _target_: gigaevo.config.helpers.build_dag_from_builder
  builder: ${pipeline_builder}
