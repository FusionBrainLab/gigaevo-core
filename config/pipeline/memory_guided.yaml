# @package _global_
#
# Memory-guided mutation pipeline.
#
# DAG:
#   - IntraMemoryStage builds the per-parent history summary.
#   - MemoryContextStage selects cross-run memory cards from memory.provider.
#   - MutationSuggestionStage is the single consumer of external cards; raw
#     card text never goes directly into MutationContextStage.memory.
#
# Write cadence is deliberately absent from this pipeline config. Use
# memory/write=end_of_run or memory/write=live to enable writer hooks.

defaults:
  - /pipeline_feature/archive_gate
  - _self_

pipeline:
  id: memory_guided
  reads_external_memory: true
  routes_program_metadata: true

evolution_context:
  _target_: gigaevo.entrypoint.evolution_context.EvolutionContext
  problem_ctx: ${problem_context}
  llm_wrapper: ${ref:llm}
  storage: ${ref:program_storage}
  prompts_dir: ${prompts.dir}
  prompt_fetcher: ${prompt_fetcher}
  memory_provider: ${ref:memory.provider}

pipeline_builder:
  _target_: gigaevo.entrypoint.lineage_memory_pipeline.MemoryGuidedMutationPipelineBuilder
  ctx: ${evolution_context}
  stage_timeout: ${stage_timeout}
  dag_timeout: ${dag_timeout}
  max_parallel: ${dag_concurrency}
  max_insights: ${max_insights}
  max_code_length: ${max_code_length}
  intra_max_children: 24
  mutation_mode: ${mutation_mode}
  enable_optuna_stage: ${enable_optuna_stage}
  optimization_time_budget: ${optimization_time_budget}
  program_format_feature: ${ref:program_format.evaluation_feature}
  # Card selection is conditioned on the fresh this-pass parent-history summary
  # + live evolutionary snapshot. false falls back to the one-pass-stale
  # metadata block.
  fresh_context_reorder: true
  reverse_repack: false
  no_card_control_probability: 0.10
  memory_block_last: false
  enable_chain_structural_metrics: ${enable_chain_structural_metrics}

dag_blueprint:
  _target_: gigaevo.config.helpers.build_dag_from_builder
  builder: ${pipeline_builder}
