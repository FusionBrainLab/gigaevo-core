# @package _global_
# Pipeline for problems whose genome IS a JSON document (not Python source):
# the standard (intra-memory) pipeline with ValidateCodeStage and
# CallProgramFunction swapped for ParseJsonProgram, and initial programs loaded
# as *.json. Problem-agnostic — the problem's own validate() consumes the parsed
# document. Launch: python run.py problem.name=<json-genome problem> pipeline=program_is_json ...

pipeline:
  id: program_is_json
  reads_external_memory: false

# Problem-local prompts (chain-flavored mutation + structured_diff prompts);
# files absent here fall back to package defaults per-file.
prompts:
  dir: ${problem.dir}/prompts

evolution_context:
  _target_: gigaevo.entrypoint.evolution_context.EvolutionContext
  problem_ctx: ${problem_context}
  llm_wrapper: ${ref:llm}
  storage: ${ref:program_storage}
  prompts_dir: ${prompts.dir}
  prompt_fetcher: ${prompt_fetcher}
  memory_provider: ${ref:memory.provider}

pipeline_builder:
  _target_: problems.chains.json_pipeline.JsonChainPipelineBuilder
  ctx: ${evolution_context}
  stage_timeout: ${stage_timeout}
  dag_timeout: ${dag_timeout}
  max_parallel: ${dag_concurrency}
  max_insights: ${max_insights}
  max_code_length: ${max_code_length}
  intra_max_children: 24
  mutation_mode: ${mutation_mode}
  enable_optuna_stage: ${enable_optuna_stage}
  optimization_time_budget: ${optimization_time_budget}

dag_blueprint:
  _target_: gigaevo.config.helpers.build_dag_from_builder
  builder: ${pipeline_builder}

program_loader:
  pattern: "*.json"
