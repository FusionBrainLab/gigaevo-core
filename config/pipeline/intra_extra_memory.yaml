# @package _global_
#
# Live intra/extra-memory pipeline.
#
# REQUIRED CLI co-override:
#   memory=full   — the memory config graph supplies BOTH the provider this
#                   pipeline reads AND the MemoryWriter the live refresh hook
#                   writes; with memory=none both collapse to Null targets.
#
# Full acceptance command:
#   OPENAI_API_KEY=sk-gigaevo python run.py \
#     problem.name=heilbron llm_base_url=http://localhost:8000/v1 \
#     model_name=Qwen/Qwen3-235B-A22B-Instruct-2507 redis.db=10 num_parents=1 \
#     pipeline=intra_extra_memory memory=full
#
# Wiring:
#   - pipeline_builder    = IntraExtraMemoryPipelineBuilder
#                            (adds IntraMemoryStage + MemoryContextStage; cards
#                             feed ONLY MutationSuggestionStage — the suggester
#                             is the single hint source for the mutator).
#   - post_step_hook      = LiveMemoryRefreshHook(refresh_every=10) bound to
#                            the same MemoryWriter that Hydra builds for
#                            post_run_hook, so mid-run + end-of-run share
#                            writer state (card bank, seen ids).

evolution_context:
  _target_: gigaevo.entrypoint.evolution_context.EvolutionContext
  problem_ctx: ${problem_context}
  llm_wrapper: ${ref:llm}
  storage: ${ref:program_storage}
  prompts_dir: ${prompts.dir}
  prompt_fetcher: ${prompt_fetcher}
  memory_provider: ${ref:memory.provider}

pipeline_builder:
  _target_: gigaevo.entrypoint.lineage_memory_pipeline.IntraExtraMemoryPipelineBuilder
  ctx: ${evolution_context}
  stage_timeout: ${stage_timeout}
  dag_timeout: ${dag_timeout}
  max_parallel: ${dag_concurrency}
  max_insights: ${max_insights}
  max_code_length: ${max_code_length}
  intra_max_children: 24
  mutation_mode: ${mutation_mode}
  enable_optuna_stage: ${enable_optuna_stage}
  optimization_time_budget: ${optimization_time_budget}
  # GAM-fresh-context reorder. true (Arm C): the card selector is conditioned
  # on the fresh this-pass lineage card + live evolutionary snapshot. false
  # (Arm B): the selector falls back to the one-pass-stale metadata block
  # (pre-reorder behaviour). Override per arm: pipeline_builder.fresh_context_reorder=false
  fresh_context_reorder: true
  # Lost-in-the-middle placement levers, both default-off (current order):
  # reverse_repack renders extra cards worst-first (best card last, nearest the
  # instruction); memory_block_last moves the memory block to the end of the
  # composite mutation context.
  reverse_repack: false
  # Randomly withhold selected memory cards from this fraction of otherwise
  # card-eligible mutations. These children become fair no-card controls for
  # baseline-adjusted card reputation instead of estimating no-card progress only
  # from policy abstentions.
  no_card_control_probability: 0.10
  memory_block_last: false

dag_blueprint:
  _target_: gigaevo.config.helpers.build_dag_from_builder
  builder: ${pipeline_builder}

# Live external-memory refresh — wraps the same MemoryWriter instance so the
# mid-run hook and the post-run hook share writer state (card bank, seen ids).
# refresh_every counts ingestor sweeps that landed >=1 program. K=10 ≈ one
# refresh per ~10 newly-evaluated mutants.
# max_programs_per_sweep caps each refresh to the N newest programs, which
# bounds the librarian's per-sweep ingest work and keeps sweep time from
# growing linearly with storage size.
#
# post_step_hook_timeout_s raises the engine's per-invocation wall-clock budget
# from the 300 s global default (sized for the CPU-bound CompositionInjectionHook)
# to 900 s for the network-bound LLM-enrichment refresh: under shared-endpoint
# load a single capped (24-program) increment can exceed 300 s and gets
# cancelled, freezing the card bank. 900 s (3×) absorbs that latency while still
# bounding a genuinely-hung hook to 15 min. Override per run: post_step_hook_timeout_s=<s>.
post_step_hook_timeout_s: 900.0
post_step_hook:
  _target_: gigaevo.memory.live_memory_hook.LiveMemoryRefreshHook
  tracker: ${ref:memory.writer}
  storage: ${ref:program_storage}
  refresh_every: 10
  max_programs_per_sweep: 24
